<!doctype html>
<html lang="en"><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--ink);background:var(--bg);font-feature-settings:"tnum" 1}button{font-family:inherit}</style><style>.bal{max-width:350px;border-radius:var(--radius-xl);background:var(--accent-deep);color:var(--on-accent);padding:18px}.bal .k{font-size:14px;opacity:.9}.bal .n{font-size:36px;font-weight:700;letter-spacing:-0.02em;margin-top:2px}.in2{display:flex;gap:10px;margin-top:14px}.in2>div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}.in2 small{display:block;font-size:12px;opacity:.9}.in2 b{font-size:16px}.sum{display:flex;gap:10px;max-width:350px;margin-top:12px}.sum>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px}.sum small{display:block;font-size:12px;color:var(--muted)}.sum b{font-size:17px}</style></head><body><div class="bal"><div class="k">Total balance</div><div class="n">$1,715</div><div class="in2"><div><small>Income</small><b>+$1,400</b></div><div><small>Spent</small><b>−$963.50</b></div></div></div><div class="sum"><div><small>Owed to you</small><b style="color:var(--income)">$124</b></div><div><small>You owe</small><b style="color:var(--expense)">$300</b></div></div></body></html>
