<!doctype html>
<html lang="en"><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--ink);background:var(--bg);font-feature-settings:"tnum" 1}button{font-family:inherit}</style><style>.chips{display:flex;gap:8px;margin-bottom:16px}.ch{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink)}.ch.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.seg{display:flex;background:var(--surface-tint);border-radius:12px;padding:3px;max-width:350px;margin-bottom:16px}.seg button{flex:1;height:42px;border:0;background:transparent;border-radius:var(--radius-sm);font-size:15px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--surface);color:var(--ink);font-weight:700}.pill{display:inline-block;padding:3px 9px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;margin-right:6px}</style></head><body><div class="chips"><button class="ch on">All</button><button class="ch">Expense</button><button class="ch">Income</button></div><div class="seg"><button class="on">Expense</button><button>Income</button><button>Transfer</button></div><span class="pill" style="background:var(--accent-tint);color:var(--accent)">Paid</span><span class="pill" style="background:var(--warning-tint);color:var(--warning)">Part paid</span><span class="pill" style="background:var(--expense-tint);color:var(--expense)">Owes</span></body></html>
