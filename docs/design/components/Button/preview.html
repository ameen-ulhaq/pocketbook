<!doctype html>
<html lang="en"><head><link rel="stylesheet" href="../../tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--ink);background:var(--bg);font-feature-settings:"tnum" 1}button{font-family:inherit}</style><style>.b{display:flex;align-items:center;justify-content:center;gap:8px;height:var(--size-button);border-radius:var(--radius-md);font-size:16px;font-weight:600;width:100%;border:0;cursor:pointer}.p{background:var(--accent);color:var(--on-accent)}.s{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.d{background:var(--surface);color:var(--expense);border:1px solid var(--line)}.dis{opacity:.45}.row{display:flex;flex-direction:column;gap:var(--space-2);max-width:350px}.two{display:flex;gap:10px}</style></head><body><div class="row"><button class="b p">Save expense</button><button class="b s">Edit</button><button class="b d">Delete</button><button class="b p dis" disabled>Save expense</button><div class="two"><button class="b p">Record payment</button><button class="b s">Remind</button></div></div></body></html>
